[global]
developmentMode = false

[theme]
base = "light"
primaryColor = "#285E64"
backgroundColor = "#FAF8F3"
secondaryBackgroundColor = "#F0ECE4"
textColor = "#223A3C"
font = "sans serif"

[server]
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[logger]
level = "warning"
